name: Build and Deploy Butvan Blog 2.0

on:
  push:
    branches:
      - release # 代码推送到 release 分支时自动触发流水线

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 登录到 阿里云容器镜像服务 (ACR)
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 1. 构建并推送后端 Java 服务镜像
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-service:latest

      # 2. 构建并推送管理后台前端镜像
      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./fronted/blog-admin
          file: ./fronted/blog-admin/Dockerfile
          push: true
          no-cache: true
          tags: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-admin:latest

      # 3. 构建并推送新一代博客前台镜像 (frontend-next)
      - name: Build and Push Client Frontend (frontend-next)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-next
          file: ./frontend-next/Dockerfile
          push: true
          no-cache: true
          tags: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-client:latest

      # 将 Redis 镜像从 Docker Hub 镜像到 ACR，服务器部署时只访问阿里云仓库。
      - name: Mirror Redis Runtime Image to Aliyun ACR
        run: |
          set -euo pipefail

          source_image="redis:7-alpine"
          target_image="crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/redis:7-alpine"

          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "$source_image"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to pull $source_image after $attempt attempts."
              exit 1
            fi

            delay=$((attempt * 10))
            echo "Docker Hub pull failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done

          docker tag "$source_image" "$target_image"
          docker push "$target_image"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      # 将 PostgreSQL 18 外置部署配置同步到服务器，避免依赖服务器残留文件。
      - name: Upload PostgreSQL 18 Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: docker-compose.postgres18.yml
          target: /opt/blog

      # 通过 SSH 登录到目标服务器，进入部署目录执行 Docker 升级命令
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # 使用外置 PostgreSQL 配置，避免启动第二个 PostgreSQL 实例。
            cd /opt/blog

            docker compose -f docker-compose.postgres18.yml config --quiet

            # 拉取最新镜像；短暂网络波动时最多重试三次。
            pull_attempt=1
            until docker compose -f docker-compose.postgres18.yml pull; do
              if [ "$pull_attempt" -ge 3 ]; then
                echo "Image pull failed after $pull_attempt attempts."
                exit 1
              fi

              delay=$((pull_attempt * 15))
              echo "Image pull failed; retrying in ${delay}s (attempt $((pull_attempt + 1))/3)."
              sleep "$delay"
              pull_attempt=$((pull_attempt + 1))
            done

            # 启动博客服务；外置 PostgreSQL 由独立 Compose 项目管理。
            docker compose -f docker-compose.postgres18.yml up -d

            # 自动清理服务器上残留的无标签虚无镜像，节省磁盘空间
            docker image prune -f

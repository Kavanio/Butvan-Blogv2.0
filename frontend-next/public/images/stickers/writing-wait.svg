<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#f0f0f0"/>

  <!-- The wait, as a track: three thresholds and a marker still travelling -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#cccccc" stroke-width="1"/>

  <!-- 100ms -->
  <rect x="19.5" y="27" width="1" height="10" rx="0.5" fill="#bbbbbb"/>
  <!-- 1s -->
  <rect x="31.5" y="27" width="1" height="10" rx="0.5" fill="#bbbbbb"/>
  <!-- 10s -->
  <rect x="43.5" y="27" width="1" height="10" rx="0.5" fill="#202020"/>

  <!-- Where you are: mid-wait, between the first and the second -->
  <circle cx="26" cy="32" r="3" fill="#202020"/>
</svg>
